version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: medsys
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: medsys_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medsys-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: