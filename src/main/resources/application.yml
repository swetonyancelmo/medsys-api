spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/medsys_db
    username: postgres
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItbWVkc3lzLWp3dC0yNTZiaXRz}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
