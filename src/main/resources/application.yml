spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/medsys_db
    username: postgres
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # Obrigatório: sem valor padrão de propósito. Se a variável faltar, a aplicação
  # não sobe (melhor que assinar tokens com uma chave pública). Veja o .env.example.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
